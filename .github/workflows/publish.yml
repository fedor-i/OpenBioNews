name: Publish to PyPI

# Publishes the package when you cut a GitHub Release (tag like v0.3.0), then lists
# that version in the official MCP Registry (registry.modelcontextprotocol.io).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# One-time setup on PyPI: create the project's "Trusted Publisher" pointing at
#   owner: fedor-i, repo: OpenBioNews, workflow: publish.yml, environment: pypi
# See https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # List this version in the official MCP Registry. The registry proves we own the
  # PyPI package by finding "mcp-name: io.github.fedor-i/openbionews" in its PyPI
  # description (the README), so this runs after PyPI has the release. Sign-in is
  # GitHub OIDC: no token is stored in the repo.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry OIDC sign-in
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches the released version
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::release tag $GITHUB_REF_NAME doesn't match pyproject version $want"; exit 1
          fi
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$v" != "$want" ]; then echo "::error::server.json says $v but the package is $want"; exit 1; fi
          done
      - name: Wait for PyPI to serve this version
        run: |
          set -euo pipefail
          v="$(jq -r .version server.json)"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/openbionews/$v/json" >/dev/null; then exit 0; fi
            sleep 20
          done
          echo "::error::PyPI never showed openbionews $v"; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
