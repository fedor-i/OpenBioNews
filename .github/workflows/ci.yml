name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile all modules
        run: python -m compileall -q openbionews
      - name: Run the test suite (standard library only)
        run: python tests/test_pipeline.py
      - name: Guard the hosted Insights analytics (standard library only)
        run: python tests/test_web_insights.py
      - name: Run the MCP server tool tests (standard library only)
        run: python tests/test_mcp.py
      - name: Verify the package installs and the CLI runs
        run: |
          pip install .
          openbionews --version
          openbionews run --demo --quiet --stdout

  distros:
    name: distro (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # Secondary robustness coverage; the authoritative cross-platform gate is the
    # `test` job above. Don't let a container-registry hiccup fail the whole run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Prove the pure-stdlib core runs across Linux distributions and libc
        # flavours: Debian (glibc), Alpine (musl) and Fedora. Images are pulled
        # from the AWS ECR Public mirror of Docker's official images, which allows
        # anonymous pulls without Docker Hub's unauthenticated rate limit (the
        # cause of past "toomanyrequests" / pull-timeout CI failures).
        include:
          - name: "python:3.12-slim-bookworm"   # Debian 12, glibc
            image: "public.ecr.aws/docker/library/python:3.12-slim-bookworm"
          - name: "python:3.11-slim-bullseye"   # Debian 11, glibc
            image: "public.ecr.aws/docker/library/python:3.11-slim-bullseye"
          - name: "python:3.12-alpine"           # Alpine, musl libc
            image: "public.ecr.aws/docker/library/python:3.12-alpine"
          - name: "fedora:40"                    # Fedora (installs python3)
            image: "public.ecr.aws/docker/library/fedora:40"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python on Fedora
        if: startsWith(matrix.name, 'fedora')
        run: dnf install -y python3 python3-pip
      - name: Show interpreter
        run: python3 --version
      - name: Byte-compile all modules
        run: python3 -m compileall -q openbionews
      - name: Run the test suite (standard library only)
        run: python3 tests/test_pipeline.py
      - name: Guard the hosted Insights analytics (standard library only)
        run: python3 tests/test_web_insights.py
      - name: Run the MCP server tool tests (standard library only)
        run: python3 tests/test_mcp.py
      - name: Verify the package installs and the CLI runs
        run: |
          python3 -m pip install --break-system-packages . || python3 -m pip install .
          openbionews --version
          openbionews run --demo --quiet --stdout
