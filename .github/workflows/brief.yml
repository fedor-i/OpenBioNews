name: Weekly brief

# Every Monday: build "This week in biopharma records" for the week that just ended,
# publish it on the site (docs/brief/), and leave a LinkedIn draft in the run summary
# to review and edit before posting. The page itself is records only, each linked to
# its official source, so it's published without a manual step.
on:
  schedule:
    - cron: "37 6 * * 1"        # Mondays, 06:37 UTC
  workflow_dispatch:
    inputs:
      end:
        description: "Week ending on this Sunday (YYYY-MM-DD); blank = last full week"
        required: false

permissions:
  contents: write   # commit the new week's page
  actions: write    # start the Pages deploy (a push by this workflow doesn't trigger it)

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the brief
        env:
          END: ${{ github.event.inputs.end }}
          # SEC requires a contact email in the User-Agent. Repository secret EDGAR_UA,
          # e.g. "OpenBioNews-CI you@example.com" (a secret, so it's masked in the logs).
          # Without it the SEC section reads "unavailable".
          OPENBIONEWS_EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: python tools/weekly_brief.py ${END:+--end "$END"} > linkedin.txt
      - name: Render the share images
        # A preview card for the week's page and a portrait image to attach to the post.
        # Optional: if this fails, the brief still publishes with the site-wide image.
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/brief_card.py
          python tools/weekly_brief.py --render-only
      - name: Make the LinkedIn video and swipeable PDF
        # The site's front-box slides (with the new week) as an MP4 and a PDF for a
        # LinkedIn "document" post. Captured from a local copy of docs/, so the new
        # week shows before it's deployed. Optional, like the images above.
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          python -m http.server 8000 --directory docs >/dev/null 2>&1 &
          sleep 2
          python tools/brief_reel.py --site http://localhost:8000/ --out reel
      - name: Show the LinkedIn draft
        run: |
          {
            echo "## LinkedIn draft (review before posting)"
            echo '```'
            cat linkedin.txt
            echo '```'
            echo
            echo "Download the **linkedin-draft** artifact below. It has the post text, a portrait"
            echo "image (-post.png), a video (reel.mp4) and a swipeable PDF (reel.pdf): attach one."
            week="$(ls docs/brief/data | sort | tail -1 | sed 's/.json//')"
            echo
            echo "LinkedIn newsletter edition (title, cover image, one-click copy of the article):"
            echo "https://fedor-i.github.io/OpenBioNews/brief/${week}-edition.html (live once the site deploys)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-draft
          path: |
            linkedin.txt
            docs/brief/cards/*-post.png
            reel/reel.mp4
            reel/reel.pdf
      - name: Commit the new week
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/brief docs/sitemap.xml
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          week="$(ls docs/brief/data | sort | tail -1 | sed 's/.json//')"
          git commit -m "Weekly brief: week ending $week"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
